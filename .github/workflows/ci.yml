name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: G–V map check
        run: python scripts/render_gv_map.py --check
      - name: Docs link check
        run: python scripts/check_docs_links.py
      - name: Registry tests
        run: pytest -q tests/test_gv_registry.py tests/test_config_env.py
      - name: Base test tier (no torch)
        # This tier deliberately has NO torch installed, so it must not collect
        # suites that import torch at module scope. Those still run in the
        # `pesn` job (which installs CPU torch), so coverage is unchanged.
        run: |
          pytest -q --ignore=tests/pesn \
            --ignore=tests/agent_ops/test_v53mp_50k_tier.py \
            --ignore=tests/agent_ops/test_v53mp_loader_streaming_cert.py \
            --ignore=tests/agent_ops/test_v541_h0_legality_audit.py \
            --ignore=tests/agent_ops/test_v541_runner_contract.py \
            --ignore=tests/test_i3_infra.py \
            --ignore=tests/test_v53mp_tau_recompute.py

  pesn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full test tier
        run: pytest -q
