name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: G–V map check
        run: python infra/governance/render_gv_map.py --check
      - name: Docs link check
        run: python infra/governance/check_docs_links.py
      - name: Docs consistency gate
        run: python infra/governance/docs_consistency.py --strict
      - name: Registry tests
        run: pytest -q tests/test_gv_registry.py tests/test_config_env.py
      - name: Architecture boundary guard
        run: pytest -q tests/kernel
      - name: Base test tier (no torch)
        # No torch in this job: the V5.6 engine contract suite (tests/v5) is
        # exercised by the `engine` job below, which installs CPU torch.
        run: pytest -q --ignore=tests/v5

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Architecture boundary guard (with ruff)
        run: pytest -q tests/kernel
      - name: Full active tier (three plates + engine contracts)
        run: pytest -q
