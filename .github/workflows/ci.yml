name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: G–V map check
        run: python infra/governance/render_gv_map.py --check
      - name: Docs link check
        run: python infra/governance/check_docs_links.py
      - name: Docs consistency gate
        run: python infra/governance/docs_consistency.py --strict
      - name: Registry tests
        run: pytest -q tests/test_gv_registry.py tests/test_config_env.py
      - name: Architecture boundary guard
        run: pytest -q tests/kernel
      - name: Base test tier (no torch)
        # This tier deliberately has NO torch installed, so it must not collect
        # suites that import torch at module scope. The historical V4/V5.1-V5.4
        # tier (tests/legacy) and the V5.6 engine contracts (tests/v5) are
        # exercised by the `pesn` job below, which installs CPU torch.
        run: pytest -q --ignore=tests/legacy --ignore=tests/v5

  pesn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Full test tier (includes legacy + V5.6 engine contracts)
        run: pytest -q -m "not (realdata or xtb or acp or orca)"
