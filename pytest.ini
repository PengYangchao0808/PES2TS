[pytest]
testpaths = tests
markers =
    realdata: requires network and/or the ~12GB real download
    xtb: requires the real GFN2-xTB binary
    acp: requires PES2TS_ACP_ROOT and an ACP python interpreter
    orca: requires PES2TS_ORCA_EXECUTABLE
    v5: V5.6 single training engine contract tests (CPU-only unless marked cuda)
    cuda: requires a CUDA-capable GPU (skipped on CPU hosts)

# Active tier only: three plates + infra. Historical V4/V5.1-V5.4 code lives on
# the read-only branch `frozen/v4-v54-history`, NOT in the worktree.
addopts = -m "not realdata and not xtb and not acp and not orca"
