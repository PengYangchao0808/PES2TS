[pytest]
testpaths = tests
markers =
    realdata: requires network and/or the ~12GB real download
    xtb: requires the real GFN2-xTB binary
    acp: requires PES2TS_ACP_ROOT and an ACP python interpreter
    orca: requires PES2TS_ORCA_EXECUTABLE
addopts = -m "not realdata and not xtb and not acp and not orca"
