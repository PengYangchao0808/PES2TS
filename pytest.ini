[pytest]
testpaths = tests
markers =
    realdata: requires network and/or the ~12GB real download
    xtb: requires the real GFN2-xTB binary
    acp: requires PES2TS_ACP_ROOT and an ACP python interpreter
    orca: requires PES2TS_ORCA_EXECUTABLE
    legacy: historical V4 / V5.1-V5.4 tests under tests/legacy (skipped by default; CI full tier runs them)
    v5: V5.6 single training engine contract tests (CPU-only, no GPU required)

# Daily gate: active tier only. `tests/legacy/**` is ignored at COLLECTION time
# (not merely de-selected by marker) because several historical modules import
# POSIX-only modules (fcntl/resource); a collection-time import error must never
# break the daily run. The marker still auto-applies, so `-m legacy` can select
# the tier explicitly.
#
# Nightly / archive-change run (full tier, includes legacy):
#   pytest -q -o addopts= -m "not (realdata or xtb or acp or orca)"
addopts = --ignore=tests/legacy -m "not realdata and not xtb and not acp and not orca"
