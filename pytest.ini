[pytest]
testpaths = tests
markers =
    realdata: requires network and/or the ~12GB real download
    xtb: requires the real GFN2-xTB binary
    acp: requires PES2TS_ACP_ROOT and an ACP python interpreter
    orca: requires PES2TS_ORCA_EXECUTABLE
    legacy: historical V4 / V5.1-V5.4 tests under tests/legacy (skipped by default; CI full tier runs them)
    v5: V5.6 single training engine contract tests (CPU-only, no GPU required)
addopts = -m "not realdata and not xtb and not acp and not orca and not legacy"
