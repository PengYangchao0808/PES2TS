# G–V map: G = code/physics capability, V = training/test campaign.
# This file is the single machine-readable source of truth.  The human-readable
# table in docs/design/PES2TS_G_V_MAPPING_v1_20261018.md is rendered from it.
schema: pes2ts_gv_map_v1
map_version: "2026-10-18.1"

stages:
  G0:
    title: Data base, truth quarantine and split freeze
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/g0/**/*.py"]
  G1:
    title: Chemical task, graph audit and legal action compilation
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/g1/**/*.py"]
  G2:
    title: Classic physical closure, Shield and replayable baseline
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/generation/**/*.py"]
  G2.T:
    title: G2 24-case test and strict physical verification
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/integration/**/*.py", "pes2ts_core/generation/**/*.py"]
  G3.P.0:
    title: Source/identity/split reconciliation for PES-N
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/contracts/inputs.py", "pes2ts_core/pesn/offline/splits/**/*.py"]
  G3.P.1:
    title: Teacher state/label construction and deployable features
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/offline/data/**/*.py", "pes2ts_core/pesn/features/**/*.py"]
  G3.P.2:
    title: Small-graph encoder, multi-task training and scaling ablations
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/models/**/*.py", "pes2ts_core/pesn/offline/training/**/*.py"]
  G3.P.3:
    title: Frozen weights/gates, sealed evaluation and research bundle
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/offline/evaluation/**/*.py", "pes2ts_core/pesn/bundle/**/*.py"]
  G3.1:
    title: Single-point p_seed, refinement cost and Q_STOP supervision
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/inference/**/*.py", "pes2ts_core/pesn/models/**/*.py"]
  G3.2:
    title: Context, action imitation and bounded Classic residual
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/contracts/control.py", "pes2ts_core/pesn/models/control_heads.py", "pes2ts_core/pesn/offline/control_trainer.py"]
  G4.0:
    title: Conservative offline value/Q on compatible transitions
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/pesn/contracts/control.py", "pes2ts_core/pesn/offline/transitions.py", "pes2ts_core/pesn/offline/control_trainer.py"]
  G4.1:
    title: Frozen-model real QC closed loop and in-train collection
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: ["pes2ts_core/generation/control_round.py", "pes2ts_core/integration/**/*.py"]
  G4.2:
    title: Full-system, cross-generator and release evidence
    stage_doc: docs/plans/PES2TS_阶段定义_G0-G3.md
    code_globs: []

