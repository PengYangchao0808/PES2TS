ed_move_process only; §11.2 thresholds signed-frozen; old V5.4 unchanged); 2026-10-21 ADR-0031 V5.2/V5.2-R CLOSED; V5.3-MP registered; 30h V5.3 rollout renamed V5.3-ENG; FullPathNavigationContract v1 superseded by MoveProcessContract v1."

