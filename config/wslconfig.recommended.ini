; S4 infra plan §5.1 — RECOMMENDED .wslconfig for the PES2TS WSL2 VM
; (supersedes the current memory=56GB / swap=0 config that caused two
;  host OOMs on 2026-10-22; see docs/infra/wsl_memory_governance.md)
;
; Install: copy this file to %UserProfile%\.wslconfig on Windows, then run
;          `wsl --shutdown` from PowerShell/CMD (a plain `wsl -d` does NOT
;          reload the VM; the memory ceiling only applies after a restart).
;
; Why 40 GB: the host has 64 GB; 56 GB left nothing for Windows and the
;           GPU driver, so the HOST ran out (guest cgroup oom_kill=0 while
;           guest anon was 37 GiB — no guest cap can prevent a host cliff).
;           40 GB keeps ~24 GB for Windows. If the host has less RAM,
;           scale to ~70% of physical.
;
; Why swap=8 GB: safety cushion ONLY, never capacity. The hard gate is
;           per-run: memory.swap.current > 0 sustained during training =
;           FAILED run (plan §5.1). A run that "finishes on swap" is not
;           accepted. Keep swapFile on a fast local disk (E: here).
;
; autoMemoryReclaim=gradual: lets the WSL VM give memory back to Windows
;           gradually instead of keeping every freed page pinned.

[wsl2]
memory=40GB              ; was 56GB; host-OOM mitigation (plan §5.1)
swap=8GB                 ; was 0; safety cushion, see swap gate above
swapFile=E:\wsl_swap\swap.vhdx

[experimental]
autoMemoryReclaim=gradual
