; S4 infra plan §5.1 — RECOMMENDED .wslconfig for the PES2TS WSL2 VM
; (supersedes the current memory=56GB config that contributed to the
;  host OOMs on 2026-10-22; see docs/infra/wsl_memory_governance.md)
;
; Install: copy this file to %UserProfile%\.wslconfig on Windows, then run
;          `wsl --shutdown` from PowerShell/CMD (a plain `wsl -d` does NOT
;          reload the VM; the memory ceiling only applies after a restart).
;
; Why 36 GB: the host has 64 GB; 56 GB left nothing for Windows and the
;           GPU driver, so the HOST ran out (guest cgroup oom_kill=0 while
;           guest anon was 37 GiB — no guest cap can prevent a host cliff).
;           2026-10-24 Hyper-V forensics: StorageVSP 0xC000012D
;           (STATUS_COMMITMENT_LIMIT) -> vCPU triple fault. 40 GB still left
;           only 8.8 GB commit headroom on a 54 GB tree verify; 36 GB is the
;           reviewed floor. If the host has less RAM, scale to ~60-65%.
;
; Why swap=0: HARD POLICY — never enable swap on this machine. Swap writes
;           wear the SSD, and a run that "finishes on swap" is a failed run
;           anyway (latency collapses). Memory safety comes from the 40 GB
;           VM ceiling plus the per-run cgroup MemoryMax, not from swap.
;           The sampler still watches memory.swap.current as a tripwire.
;
; autoMemoryReclaim=gradual: lets the WSL VM give memory back to Windows
;           gradually instead of keeping every freed page pinned.

[wsl2]
memory=36GB              ; was 56GB; host-commit mitigation (2026-10-24 forensics)
swap=0                   ; never enable swap (SSD wear; swap = failed run)

[experimental]
autoMemoryReclaim=gradual
