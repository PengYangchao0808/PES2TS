paths:
  data_root: data
  raw: data/raw/reaction_qm
  interim: data/interim
  ground_truth: data/ground_truth
  truth_sources: data/ground_truth/sources
  manifests: data/manifests
split:
  seed: 42
near_dup:
  threshold: 0.90
  cluster_threshold: 0.80
  fp_size: 2048
  block_size: 1000
  max_seconds: 7200
  max_pairs: 10000
cohorts:
  trial: 200
  stratified: 1000
  require_authoritative_strata: false
g1:
  shard_size: 1000
  match_cap: 10000
  max_candidates: 64
  bond_tolerance: 0.45
  neighborhood_shell: 1
  sample_size: 20
  sample_seed: 42
g1_truth:
  shard_size: 1000
  max_combinations: 1024
  rmsd_class_tolerance: 0.05
  endpoint_rmsd_pass: 1.0
  endpoint_rmsd_weak: 3.0
  ts_frame_tolerance: 1.0e-4
  splice_factor: 5.0
  bond_distance_tolerance: 0.45
  permutation_budget: 64
  per_reaction_lookup_threshold: 512
  sample_size: 20
  sample_seed: 42
g1_class:
  taxonomy_version: "g1p2_taxonomy_v1"
  canonical_budget: 2000
  sample_size: 20
  sample_seed: 42
g2:
  eligible_path: null            # null => <paths.interim>/g2_eligible.json
  shard_size: 1000
  keep_trials: false             # xtbpath_<n>.xyz segment files kept only when true
  xtb:
    executable: null             # null => shutil.which("xtb") => fallback_paths
    fallback_paths: ["/opt/xtb/bin/xtb", "/usr/local/bin/xtb"]
    threads: 4
    timeout_seconds: 1800
    seed: 42
  path:                          # path.inp $path block
    nrun: 1
    npoint: 25
    anopt: 10
    kpush: 0.003
    kpull: -0.015
    ppull: 0.05
    alp: 1.2
  assembly:
    min_anchor_maps: 3
    anchor_tolerance: 0.001      # Angstrom; second singular value threshold
    forming_min_distance: 2.0    # Angstrom
    forming_target_distance: 3.0 # Angstrom
    bond_tolerance: 0.45         # Angstrom
  validity:
    endpoint_rmsd_max: 0.5       # Angstrom
    max_frame_step: 4.0          # Angstrom
    min_frames: 8
    collision_min_distance: 0.8  # Angstrom
  reverse_retry:
    enabled: true
    trigger_codes:
      - G2_ENDPOINT_NOT_REACHED
      - G2_TOPOLOGY_DRIFT
      - G2_ENERGY_INCOMPLETE
      - G2_PATH_DISCONTINUOUS
      - G2_COLLISION
