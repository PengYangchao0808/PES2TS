  center_shell: 1
  taxonomy_version: "g1p2_taxonomy_v2"
  canonical_budget: 2000
  sample_size: 20
  sample_seed: 42

# G1 scan-strategy policy (P0–P3 graph selector). Thresholds are placeholders
# pending calibration (待校准); see
# docs/design/PES_GENERATION_图论扫描策略选择器设计_v1.md §6/§8/§9 and
# .omo/plans/pes-generation-graph-scan-strategy.md (todo 2, Interface commitments).
scan_strategy:
  generation_scope: connectivity_only
  context_radius: 2               # TODO: calibrate — event-coupling neighborhood shell (设计 §4)
  max_scan_coordinates: 3         # TODO: calibrate — ORCA 6.1 native B/A/D upper bound (设计 §8/§9.1)
  point_limits:                   # TODO: calibrate — n_points contract bounds (设计 §8.3)
    baseline: 9                   # coarse-path baseline; dev smoke only
    max: 101                      # contract upper bound; backend may be stricter
  schedule_budget: 3              # TODO: calibrate — max schedules per candidate (设计 §8.1)
  direction_budget: 2             # TODO: calibrate — max directions per candidate (设计 §8.1)
  assembly_candidate_budget: 2    # TODO: calibrate — endpoint assemblies per reaction (设计 §8.3)
  max_total_candidates:           # TODO: calibrate — first-round development caps (设计 §8.3)
    scan: 6                       # total Scan candidates across directions/assemblies/schedules
    path_neb: 1                   # initial NEB candidate
  max_step_by_kind:               # TODO: calibrate — per-method/coordinate-type step caps (设计 §8.3)
    distance: 0.2                 # Angstrom placeholder
    angle: 10.0                   # degrees placeholder
    dihedral: 10.0                # degrees placeholder
  jacobian_condition_number_max: 1.0e6  # TODO: calibrate — J=∂q/∂x rank/conditioning gate (设计 §6.3)
  element_pair_bond_thresholds:   # TODO: calibrate — bonded/unbonded radius-sum tolerance (设计 §6.3)
    tolerance: 0.45               # Angstrom; matches existing g1/g2 bond_tolerance placeholder
  special_domain_policy: unsupported  # TODO: calibrate — special-domain handling (设计 §6.3/§9.1)
  # Artifact trees for g1 v2-scan-plan/verify/freeze (todo 4). Relative paths:
  # proposals_dir/plans_dir/proposal_summary/plan_summary resolve under
  # paths.interim; proposal_manifest/plan_manifest/freeze_manifest resolve
  # under paths.manifests (g1_v2 dirname idiom).
  proposals_dir: g1_v2/scan_proposals   # per-reaction StrategyProposal tree
  plans_dir: g1_v2/scan_plans           # frozen GenerationPlanV2 tree (gated)
  proposal_summary: g1_v2_scan_proposal_summary.parquet
  plan_summary: g1_v2_scan_plan_summary.parquet
  proposal_manifest: g1_v2_scan_proposal_manifest.json
  plan_manifest: g1_v2_scan_plan_manifest.json
  freeze_manifest: g1_v2_scan_freeze.json

g2:
  eligible_path: null            # null => <paths.interim>/g2_eligible.json
  shard_size: 1000
  keep_trials: false             # xtbpath_<n>.xyz segment files kept only when true
  xtb:
    executable: null             # null => shutil.which("xtb") => fallback_paths
    fallback_paths: ["/opt/xtb/bin/xtb", "/usr/local/bin/xtb"]
    threads: 4
    timeout_seconds: 1800
    seed: 42
  path:                          # path.inp $path block
    nrun: 1
    npoint: 50                   # task-15 pilot: 25 -> 50 (denser sampling)
    anopt: 10
    kpush: 0.003
    kpull: -0.015
    ppull: 0.05
    alp: 0.5                     # task-15 pilot: 1.2 -> 0.5 (1.2 hard-fails real paths with "No product")
  assembly:
    min_anchor_maps: 3
    anchor_tolerance: 0.001      # Angstrom; second singular value threshold
    forming_min_distance: 2.0    # Angstrom
    forming_target_distance: 3.0 # Angstrom
    bond_tolerance: 0.45         # Angstrom
  validity:
    endpoint_rmsd_max: 0.5       # Angstrom
    max_frame_step: 4.0          # Angstrom
    min_frames: 8
    collision_min_distance: 0.8  # Angstrom
  reverse_retry:
    enabled: true
    trigger_codes:
      - G2_ENDPOINT_NOT_REACHED
      - G2_TOPOLOGY_DRIFT
      - G2_ENERGY_INCOMPLETE
      - G2_PATH_DISCONTINUOUS
      - G2_COLLISION
