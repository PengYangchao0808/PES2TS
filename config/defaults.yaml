# G1 scan-strategy policy (P0–P3 graph selector). Thresholds are placeholders
# pending calibration (待校准); see
# docs/design/PES_GENERATION_图论扫描策略选择器设计_v1.md §6/§8/§9 and
# .omo/plans/pes-generation-graph-scan-strategy.md (todo 2, Interface commitments).
scan_strategy:
  generation_scope: connectivity_only
  context_radius: 2               # TODO: calibrate — event-coupling neighborhood shell (设计 §4)
  max_scan_coordinates: 3         # TODO: calibrate — ORCA 6.1 native B/A/D upper bound (设计 §8/§9.1)
  point_limits:                   # TODO: calibrate — n_points contract bounds (设计 §8.3)
    baseline: 9                   # coarse-path baseline; dev smoke only
    max: 101                      # contract upper bound; backend may be stricter
  schedule_budget: 3              # TODO: calibrate — max schedules per candidate (设计 §8.1)
  direction_budget: 2             # TODO: calibrate — max directions per candidate (设计 §8.1)
  assembly_candidate_budget: 2    # TODO: calibrate — endpoint assemblies per reaction (设计 §8.3)
  max_total_candidates:           # TODO: calibrate — first-round development caps (设计 §8.3)
    scan: 6                       # total Scan candidates across directions/assemblies/schedules
    path_neb: 1                   # initial NEB candidate
  max_step_by_kind:               # TODO: calibrate — per-method/coordinate-type step caps (设计 §8.3)
    distance: 0.2                 # Angstrom placeholder
    angle: 10.0                   # degrees placeholder
    dihedral: 10.0                # degrees placeholder
  jacobian_condition_number_max: 1.0e6  # TODO: calibrate — J=∂q/∂x rank/conditioning gate (设计 §6.3)
  element_pair_bond_thresholds:   # TODO: calibrate — bonded/unbonded radius-sum tolerance (设计 §6.3)
    tolerance: 0.45               # Angstrom; matches existing g1/g2 bond_tolerance placeholder
  special_domain_policy: unsupported  # TODO: calibrate — special-domain handling (设计 §6.3/§9.1)
  # Artifact trees for g1 v2-scan-plan/verify/freeze (todo 4). Relative paths:
  # proposals_dir/plans_dir/proposal_summary/plan_summary resolve under
  # paths.interim; proposal_manifest/plan_manifest/freeze_manifest resolve
  # under paths.manifests (g1_v2 dirname idiom).
  proposals_dir: g1_v2/scan_proposals   # per-reaction StrategyProposal tree
  plans_dir: g1_v2/scan_plans           # frozen GenerationPlanV2 tree (gated)
  proposal_summary: g1_v2_scan_proposal_summary.parquet
  plan_summary: g1_v2_scan_plan_summary.parquet
  proposal_manifest: g1_v2_scan_proposal_manifest.json
  plan_manifest: g1_v2_scan_plan_manifest.json
  freeze_manifest: g1_v2_scan_freeze.json

# ACP execution wiring (ADR-0002): G2 xTB PATH executes through the ACP CLI
# only.  acp.root must point at the ACP checkout (e.g. .../ACP_V1_20260811);
# a null/empty root makes `g2 run` fail with exit 24 — no local fallback.
acp:
  root: null
  python: null              # python interpreter of the ACP environment
  config_path: null         # optional ACP config yaml (passed as --config)
  register: true            # append --register so completed CLI runs register in
                            # the ACP jobs store (acp_jobs.db under ACP_RUN_ROOT,
                            # shared with the ACP server) and resolve in the
                            # Workbench (/api/v1/jobs/{id}/s2/profile).  ACP
                            # registers only after a successful workflow, so a
                            # non-zero exit with a valid RESULT means
                            # registration failed: the attempt fails loudly with
                            # a typed --register/ACP_RUN_ROOT error, never a
                            # silent "completed" the Workbench cannot show.
                            # false = headless runs with no jobs store.

g2:
  eligible_path: null            # null => <paths.interim>/g2_eligible.json
  shard_size: 1000
  # Trial segments (xtbpath_<n>.xyz) are ACP-owned RESULT artifacts; xtbpath.xyz
  # is the sole parsing authority.  No PES2TS config switch retains them.
  xtb:
    # Feeds the frozen pes2ts_xtb_path_request_v1 recipe via acp_backend.py and
    # pipeline.py — not interchangeable with the acp.* section above.
    threads: 4
    timeout_seconds: 1800
    seed: 42
  path:                          # path.inp $path block
    nrun: 1
    npoint: 50                   # task-15 pilot: 25 -> 50 (denser sampling)
    anopt: 10
    kpush: 0.003
    kpull: -0.015
    ppull: 0.05
    alp: 0.5                     # task-15 pilot: 1.2 -> 0.5 (1.2 hard-fails real paths with "No product")
  assembly:
    min_anchor_maps: 3
    anchor_tolerance: 0.001      # Angstrom; second singular value threshold
    forming_min_distance: 2.0    # Angstrom
    forming_target_distance: 3.0 # Angstrom
    bond_tolerance: 0.45         # Angstrom
  validity:
    endpoint_rmsd_max: 0.5       # Angstrom
    max_frame_step: 4.0          # Angstrom
    min_frames: 8
    collision_min_distance: 0.8  # Angstrom
  reverse_retry:
    enabled: true
    trigger_codes:
      - G2_ENDPOINT_NOT_REACHED
      - G2_TOPOLOGY_DRIFT
      - G2_ENERGY_INCOMPLETE
      - G2_PATH_DISCONTINUOUS
      - G2_COLLISION
  # G2-AB2 WP-2: pilot-frozen branch-stability parameters
  # (pes2ts_branch_calibration_v1, most-conservative passing cell of the
  # offline analytic grid; R6: calibrated on the analytic fixtures only —
  # never on a holdout).
  continuation:
    branch_policy:
      branch_rmsd_radius: 0.25
      branch_atom_radius: 0.50
      cumulative_rmsd_radius: 0.25
      bias_kappa: 0.50
      release_iterations: 4
    cumulative_rmsd_limit: 1.0
    max_curvature_probes: 1
    max_seconds: 4000.0         # T15c calibration 2026-10-04, evidence=T15b replay
                                 # (identity 470752af): RXN_0000017762 stalled at
                                 # lambda=0.19484 under 2400 s with 12 monotone
                                 # accepted frames (BUDGET_EXHAUSTED); extrapolation
                                 # from the T15b histogram: dλ/dt ~ 9.7e-5 λ/s ->
                                 # ~3070 s to reach the round2 reference 0.298125.
                                 # 4000 s = ~30% margin over the extrapolation.
                                 # evaluation-cap-first semantics: 80 evals x 2.9s
                                 # ~ 232s < 480 local; local budget unchanged.
  # G2-AB2 WP-2 local corrector budget (T15b calibration 2026-10-04, evidence=T15-02;
  # retained unchanged in T15c — only continuation/campaign wall moved).
  # max_seconds 120 -> 480: the 120s wall clock bought only 41-42 of max_evaluations=80
  # at ~2.9s/gradient; 480s lets the evaluation cap bind first (~232s needed).
  local_corrector:
    max_seconds: 480.0
  # G2-AB2 WP-3: origin free-optimization adapter (ACP BatchOptimize non-TS).
  origin_preparation:
    method: "GFN2-xTB"
    basis: ""
    timeout_seconds: 600.0
    nproc: 2
    capability_probe: true   # fail-closed: a failed probe blocks the case typed, never a local fallback (R3)
  # G2-AB2 WP-1: campaign budget defaults (manifest build_campaign_manifest).
  # Per-path ceilings MUST equal the frozen ContinuationPolicy defaults below
  # (single source of truth, validated by BUDGET_POLICY_MISMATCH).
  campaign:
    max_frames_per_path: 80
    max_attempts_per_path: 160
    max_wall_seconds_per_path: 4000.0  # T15c: MUST equal g2.continuation.max_seconds (BUDGET_POLICY_MISMATCH)
    max_gradient_calls_per_path: 2000
    max_total_gradient_calls: 60000
    max_session_wall_seconds: 0.0         # 0 = no session wall budget
    candidate_top_k: 3
