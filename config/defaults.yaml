  raw: data/raw/reaction_qm
  interim: data/interim
  ground_truth: data/ground_truth
  truth_sources: data/ground_truth/sources
  manifests: data/manifests
split:
  seed: 42
near_dup:
  threshold: 0.90
  cluster_threshold: 0.80
  fp_size: 2048
  block_size: 1000
  max_seconds: 7200
  max_pairs: 10000
cohorts:
  trial: 200
  stratified: 1000
  require_authoritative_strata: false
g1:
  shard_size: 1000
  match_cap: 10000
  max_candidates: 64
  bond_tolerance: 0.45
  neighborhood_shell: 1
  sample_size: 20
  sample_seed: 42
g1_truth:
  shard_size: 1000
  max_combinations: 1024
  rmsd_class_tolerance: 0.05
