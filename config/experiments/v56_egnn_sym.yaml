# STATUS: BLOCKED (encoder input contract)
#
# V5.6 EGNN (StarEGNN v2, "shallow/symmetric" EGNN-lite) wiring fixture for the
# V5.7-A encoder ablation.  This config is schema-valid and resolves every name,
# but it CANNOT train today: StarEGNNv2Encoder.forward needs padded atom tensors
# (coords / atom_types / atom_mask) and the V5.5-style trajectory batch ships
# none.  `python -m pes2ts_v5.runner train --config <this file>` therefore exits
# 1 with the typed error code `ENCODER_INPUT_CONTRACT_MISMATCH` — no atom data is
# fabricated, and no EGNN result may be reported until an adapter exists.
#
# Observed (expected) failure — the capability check runs before data loading:
#   {"status": "error", "mode": "train", "error_type": "ModelBuildError",
#    "code": "ENCODER_INPUT_CONTRACT_MISMATCH", ...}
#
# Also blocked on data: store_manifest is a real V5.5 store (split_policy
# group_reaction_v1), not a synthetic fixture.
experiment_id: v56-egnn-sym
seed: 17

data:
  store_manifest: data/interim/v55_contract_store
  split_policy: group_reaction_v1

model:
  encoder: stregnn_v2          # registered, but blocked on the batch contract
  core:
    name: gru
    hidden_dim: 64
    layers: 2
    dropout: 0.0
    param_budget: 100000
  head:
    name: multi_head
    q_dim: 3
    process_classes: 3
    dropout: 0.0

loss:
  components:
    - {name: move_huber, weight: 1.0}
    - {name: process_ce, weight: 0.5}
    - {name: progress_huber, weight: 0.2}
    - {name: trust_bce, weight: 0.2}

training:
  epochs: 5
  batch_size: 8
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum: 1
  patience: 3
  amp: false
  ema_decay: null
  optimizer: {name: adamw}
  callbacks: [checkpoint_best, cost_ledger, provenance_ledger, log, early_stop]
  device: auto
  cpu_threads: 1

evaluation:
  splits: [valid, id]
  ood: [scaffold_ood, family_ood]
  cpu_benchmark: false
