    - {run_id: V542_A5C_S17, stage: T-ATTR, backbone: A5-C, seed: 17, class: diagnostic, new_training_if_activated: 1, unactivated_status: gate_skipped, winner_eligible: false, dose: formal, condition: a5_selected_backbone, activation_requires: [H0_fixture, smoke_200_conditional, profile_40_40, cost_gate, budget_record], skip_reason: a5_not_selected_backbone}
  notes: A0×3 为 matched 重训基线 (a0_reuse_decision=retrain_a0_x3); T3 列出 8 个 A1-A4 top2 预注册条件 run (激活 <=4) + 2 个 A5 supplement 条件 run (激活 <=2, 条件=a5_full_dose_complete_and_seed17_screen_pass); N_core = 3 + n_T1_seed17(<=4) + I(A5_full_dose) + n_diag2000(=6) + 2*n_top2_selected(<=2 candidates) + 2*I(A5_supplement) + I(A1C_activated) + I(A5C_activated), 按公式计数 (新训练 run 计数; smoke/profile 是技术测量不进 N_core); V541 E0×3 不在本矩阵 (仅 parity/历史参照)

evaluation_contract:
  screening_split: inner-val # 初筛/选择只看 inner-val
  selection_score: "max(direction_rel/0.03, rmse_rel_improve/0.03, delta_auprc/0.02, delta_q/0.03)"
  selection_score_use: selection_only_never_for_checkpoint_or_reporting
  selection_tie_break: [inner-val total loss, core_time]
  checkpoint_rule: 始终仅按 inner-val total loss; 禁止按 H3 指标在多个 checkpoint 中挑选
  dev_policy: frozen_final_models_only # backbone 冻结后仅最终冻结的少数模型评估一次; 不用于选择/调参
  confirm_policy: sealed_always
  tau_policy: calibrated_once_on_inner-val; never_recalibrated_on_dev
  metrics:
    move: [rmse_zero, sign, dead_fraction, fixed_coverage_direction]
    process: [endpoint_auprc, q_corr, ordering]
    compute: [params, flops, gpu_time, wall_time, vram_host_anon]
  statistics:
    bootstrap_seed_root: 20261029
    bootstrap_subseed_formula: int(sha256(f"v542|{root}|{seed}|{endpoint}").hexdigest()[:16], 16) % 2147483647
    bootstrap_subseed_note: 每 endpoint/seed 用确定性子 seed; root = bootstrap_seed_root; endpoint ∈ {move_direction, move_rmse, process_auprc, process_q}
    bootstrap_unit: curve_reaction_cluster
    pairing: same cluster same frame set; both models share resample indices
    initial_draws: 1000
    final_draws: 10000
    final_draws_ref: thresholds.final_bootstrap_draws
    ci: percentile_95
    ci_and_p_same_draws: true # CI 与 p 用同一组 paired cluster bootstrap draws
    frame_level_bootstrap_forbidden: true
    undefined_cluster_rule: both models drop the cluster; report dropped count; no imputation
    p_value_rule:
      type: one_sided_improvement_paired_cluster_bootstrap
      improvement_direction:
        direction: candidate_minus_a0
        endpoint_auprc: candidate_minus_a0
        q_corr: candidate_minus_a0
        rmse_zero: a0_minus_candidate
      formula: "p = (1 + #{seed-averaged paired bootstrap improvement <= 0}) / (10001)"
      draws: 10000 # 同 CI 的一组 draws; 分母 = 1 + 10000
      frame_level_p_forbidden: true
    holm_family:
      move_direction_exit: {alpha: 0.025, correction: holm, scope: eligible_candidate_set_within_exit}
      move_rmse_exit: {alpha: 0.025, correction: holm, scope: eligible_candidate_set_within_exit}
      process_route: {alpha: 0.025, correction: holm, scope: 2_endpoints_x_eligible_candidates, family: single_process_family}
      bonferroni_note: MOVE 两出口各 alpha=0.025 即出口间 Bonferroni; 各出口内对 eligible candidate 集做 Holm
    h3_eligible_candidates: # gate-0 A2: 结构化 (取代自由字符串; 旧 token-preserving 近邻形式拒绝)
      criteria: [completed_three_seeds, per_seed_h2_no_breach, winner_eligible] # 三条件 AND; 候选必须完成三 seed 且每 seed H2 无 breach 且 winner-eligible
      a5_rule: a5_only_when_three_seeds_complete # A5 仅当三 seed 完成才进入 eligible 集
      excluded: [A0_matched_baseline, diagnostic_variants_A1-C_A5-C] # A0 与 diagnostic variants 永不入
      note: 完成三 seed 且每 seed H2 无 breach 的 winner-eligible candidate (A5 仅当三 seed 完成); diagnostic variants (A1-C/A5-C/A0) 不入
    champion_rule: # gate-0 A2: 结构化 (取代 token 检查的散文; 资格 ≠ 选择)
      requires: holm_adjusted_p_below_alpha_and_effect_non_inferiority_conditions # 冠军资格 = adjusted p < 对应 alpha 且效应/非劣条件成立
      selection_ref: evaluation_contract.final_selection_rule # 最终选择按冻结 final_selection_rule 执行 (qualification is not selection)
      report: uncorrected_and_holm_adjusted # 报告须同时给未校正与 Holm 校正后结果
    seed_aggregation_note: 见 seed_aggregation; 本块冻结统计合同 (statistics_contract_sha256 进 run identity); final_selection_rule 完整 block 一并纳入 statistics/final-selection SHA 与 run identity
  route_logic: # fix-5 C2: 结构化显式括号逻辑 (取代任何「或」后条件悬空的散文)
    note: H3 判定与 seed17_screen_pass 显式复用同一括号逻辑; 非劣条件只约束所在支, 不得只作用于后一半
    move_route:
      pass_logic: "(direction_pass AND rmse_non_inferior) OR (rmse_pass AND direction_non_inferior)"
      direction_pass: fixed_coverage_direction 相对改善 >=3% 且绝对改善 >=0.01
      rmse_pass: rmse_zero 相对改善 >=3%
      rmse_non_inferior: rmse_zero 退化 <=2%
      direction_non_inferior: fixed_coverage_direction 退化 <=2%
    process_route:
      pass_logic: "(auprc_pass AND q_non_inferior) OR (q_pass AND auprc_non_inferior)"
      auprc_pass: endpoint_auprc delta >= 0.02
      q_pass: q_corr delta >= 0.03
      auprc_non_inferior: endpoint_auprc 下降 <=0.01
      q_non_inferior: q_corr 下降 <=0.02
    seed17_screen_reuses_same_parenthesized_logic: true
  final_selection_rule: # fix-5 C1: 最终 Backbone* 选择规则 (WP0 冻结; 不用 dev); gate-0 A2: 结构化字段 + prose 精确冻结
    definition_name: final_selection_rule
    eligible: H3-qualified 候选 only (完成三 seed 且每 seed H2 无 breach 且 adjusted p < 对应 alpha 且效应/非劣条件成立)
    eligible_condition: H3_QUALIFIED_ONLY # 结构化资格枚举 (机器字段; token 近邻如 "NOT H3-qualified; all candidates" 拒绝)
    excluded: [A0_matched_baseline, diagnostic_variants_A1-C_A5-C] # A0/diagnostic 不参加选择; 无 H3-qualified 候选则 A0 留任
    single_candidate_rule: 恰 1 个 H3-qualified 候选则该候选即 Backbone*
    single_candidate_rule_id: one_h3_qualified_candidate_is_backbone # 结构化分支枚举
    no_candidate_rule: 0 个 H3-qualified 候选则 A0 留任 (no_backbone_winner, §12 负结果写法)
    no_candidate_rule_id: zero_h3_qualified_candidates_a0_retained_no_backbone_winner # 结构化分支枚举
    dev_used: false # 不使用 dev; dev 仅最终冻结后评估一次, 永不参与选择
    report_all_qualified: true # 报告须列出全部 H3-qualified 候选
    tie_break_order: # 冻结字典序 (多候选时依次判定, 命中即停)
      - 1_route_priority_MOVE_qualified_before_PROCESS_only
      - 2_min_holm_adjusted_p_on_qualifying_confirmatory_endpoint
      - 3_max_effect_margin_on_qualifying_endpoint
      - 4_min_core_time_ratio
      - 5_min_active_backbone_params
      - 6_min_inner_val_total_loss
      - 7_min_candidate_id_lexicographic
    effect_margin_definition:
      move_direction: min(relative_effect/0.03, absolute_effect/0.01)
      move_rmse: relative_improvement/0.03
      process_auprc: delta/0.02
      process_q: delta/0.03
    rule_block_in_statistics_sha: true # 完整 rule block 进 statistics/final-selection SHA 与 run identity
    a5_c_activation_uses_selected_candidate_only: true # A5-C activation 仅用被选中的 candidate (a5_selected_backbone)
  seed_aggregation:
    min_seeds_same_direction: 2
    total_seeds: 3
    per_seed_h2_breach_forbidden: true
    pooled: per-draw seed-averaged paired difference; 95% CI lower bound > 0
    threshold_on: seed_averaged_point_estimate # 不用最好 seed
  seed17_screen_pass_predicate: # 冻结筛选 predicate (Oracle finding 2); 这是 seed17 筛选, 不是三 seed H3 声明
    definition_name: seed17_screen_pass
    scope: 仅用于 top2 eligibility 与 A5 supplement 激活; 不构成 H3 合格声明
    run_status: run done 且全部预注册指标有限 (无 NaN/Inf)
    hard_gates_all_pass: [H0_legality, H1_resource, diagnostic_gate, cost_gate] # cost_gate = core_time_ratio <= 2.0
    matched_a0_dependency: matched A0_S17 已完成 (V542_A0_S17 done 且指标有限)
    h2_no_breach: seed17 H2 全部 guard 无 breach (RMSE/zero 相对 R3 与 matched A0 退化 <=2%; sign 下降 <=0.01; dead 增加 <=0.01; fixed-coverage direction 退化 <=2%)
    h2_no_breach_thresholds: # gate-0 A2: 结构化数值 (exact-match; prose 改 sign<=0.02 等近邻一律拒绝; 数值镜像 thresholds 块)
      sign_abs_drop_max: 0.01 # = thresholds.sign_drop_abs_max
      dead_abs_increase_max: 0.01 # = thresholds.dead_fraction_increase_abs_max
      rmse_zero_rel_degradation_max: 0.02 # = thresholds.rmse_zero_regression_rel_max_pct / 100
      fixed_coverage_rel_degradation_max: 0.02 # = thresholds.fixed_coverage_direction_regression_rel_max_pct / 100
    point_effect_requirement:
      rule: 至少一路 point effect 达标 (seed17 point estimate, 非三 seed bootstrap); 显式复用 evaluation_contract.route_logic 的同一括号逻辑
      process_route: "(auprc_pass AND q_non_inferior) OR (q_pass AND auprc_non_inferior); auprc_pass = delta_auprc >= 0.02; q_pass = delta_q >= 0.03; auprc_non_inferior = AUPRC 下降 <=0.01; q_non_inferior = q 下降 <=0.02"
      move_route: "(direction_pass AND rmse_non_inferior) OR (rmse_pass AND direction_non_inferior); direction_pass = direction 相对 >=3% 且绝对 >=0.01; rmse_pass = rmse_zero 相对改善 >=3%; rmse_non_inferior = rmse_zero 退化 <=2%; direction_non_inferior = direction 退化 <=2%"
      dangling_or_condition_forbidden: true # 「或」后条件不得悬空: 非劣条件属于所在支, 两支各自括号闭合
    ranking: 满足 predicate 的 A1-A4 按冻结 screen score 排序, tie = inner-val total loss 再 core-time; 最多 2 个; 可少于 2; 不替补
    top2_freeze_requires: A0_S17 complete + A0×3 sanity band pass (V542-A0-sanity-band; A0×3 seed 均值 vs V541 E0×3 seed 均值在带宽内; T0 必须先于任何 T1 formal)
    h3_final_requires: matched A0 对应 seed (S29/S43) complete
  no_selection_leakage: 同一 inner-val manifest/SHA、同一 evaluator SHA、同一 selection rule、所有 seed 全报、append-only 决策账本
  rollout: {in_scope: false, note: "V5.4.2 止于 inner-val 选择 + 冻结统计; 无生产 No-Move / verified TS / 部署资格声明"}

gates:
  H0: {rule: "schema/no-leak/E(3)/permutation/reverse-relabel/非关键零动作/typed-invalid/restore/有限梯度 全过", on_fail: invalid_run}
  H1: {rule: "单路、无 swap/OOM、host/VRAM/预算不超线", on_fail: resource_failure 或 budget_censored}
  parity: {rule: "6 checkpoint 全 required (3 V541 E0 S17/29/43 主证据 = runs/ 下 37,900-update run 的 best inner-val checkpoint, checkpoint update 37000/36400/37800 + 3 V53MP C S17/29/43 辅助证据 = outputs/pesn/v53mp/ 下 S3 formal 20k-tier 15,400-update run 的 best inner-val checkpoint, checkpoint update 15400/15300/15400; path+SHA 已钉死于 backbone_contract.a0_migration.parity.assets, 6/6; smoke 与非钉死路径禁止) strict-audit load + CPU bitwise 5 输出+forward_move + >=8 真实 inner-val batch + GPU 1e-6/1e-5 hard cap (关 TF32, run-to-run 地板仅作诊断, floor>cap => GPU parity inconclusive, CPU bitwise 仍为决定证据) + q==order_score + evaluator parity", on_fail: invalid_run}
  H2: {rule: "每正式 seed: RMSE/zero 退化 <=2% 相对 R3 且退化 <=2% 相对同 seed matched A0; sign 绝对下降 <=0.01; dead 绝对增加 <=0.01; fixed-coverage direction 相对退化 <=2%; R3 参照必须同 evaluator/环境可重评", on_fail: scientific_failure}
  H3: {rule: "对照 matched A0 (非 R3): 路线判定用冻结括号逻辑 (evaluation_contract.route_logic) — MOVE pass = (direction_pass AND rmse_non_inferior) OR (rmse_pass AND direction_non_inferior) (direction_pass = fixed-coverage direction 相对改善 >=3% 且绝对 +0.01; rmse_pass = RMSE/zero 相对改善 >=3%; rmse_non_inferior = RMSE/zero 退化 <=2%; direction_non_inferior = direction 退化 <=2%); PROCESS pass = (auprc_pass AND q_non_inferior) OR (q_pass AND auprc_non_inferior) (auprc_pass = ΔAUPRC>=0.02; q_pass = Δq>=0.03; auprc_non_inferior = AUPRC 下降 <=0.01; q_non_inferior = q 下降 <=0.02); >=2/3 seeds 同向 + 每 seed 无 H2 breach; 三 seed seed-averaged curve-level paired bootstrap 10000 draws CI 下界 >0 (bootstrap_seed_root=20261029, 确定性子 seed 公式见 statistics); p 值 = one-sided improvement paired bootstrap (公式见 statistics.p_value_rule); Holm family 冻结: MOVE direction 与 MOVE RMSE 两 exit 各 alpha=0.025 各自对 eligible candidate 集 Holm, PROCESS 单一 family 对 2 endpoints x eligible candidates Holm, family alpha=0.025; eligible = 完成三 seed 且每 seed H2 无 breach 的 winner-eligible candidate; 冠军 = H3-qualified 集内按 evaluation_contract.final_selection_rule 冻结字典序选定; 报告未校正与校正后结果; PROCESS-only 可晋级但报告须明确 MOVE 未改善; 任何收益不豁免 H2", on_fail: no_backbone_winner}
  r3_guard_block: "R3 参照无法同 evaluator/环境重评 -> T1 阻断 (不得降级为仅 matched-A0 参照)"

