    - {run_id: V542_A5_S43, stage: T3, backbone: A5, seed: 43, class: conditional, new_training_if_activated: 1, unactivated_status: gate_skipped, winner_eligible: true, dose: formal, condition: a5_full_dose_complete_and_seed17_screen_pass, parent_gate: a5_full_dose_complete_and_seed17_screen_pass}
