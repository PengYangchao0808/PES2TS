# V5.6 smoke configuration: synthetic fixture -> 2 cores -> 1 epoch -> eval -> leaderboard.
# Run (WSL): /root/miniforge3/envs/pes2ts-gpu/bin/python scripts/v5/run_screening.py \
#            --config config/v5/smoke.yaml
stage: V56-smoke
seed: 17
archs: [M01, M04]

dataset:
  kind: synthetic
  path: data/interim/v5_synthetic_smoke
  seed: 17
  n_trajectories_per_reaction: 2
  force_rebuild: true

model:
  encoder: descriptor
  hidden_dim: 32
  core_hidden_dim: 32
  core_layers: 2
  dropout: 0.0
  core_param_budget: 100000

training:
  batch_size: 4
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum: 1
  max_epochs: 1
  patience: 2
  max_train_batches: 3
  max_val_batches: 2
  subset_fraction: 1.0
  history_len: 16
  device: auto
  train_split: train
  val_split: valid

eval:
  cpu_benchmark: true
  cpu_iters: 5
  cpu_warmup: 2
  max_eval_batches: 2
  run_rollout: true
  rollout_steps: 3
  rollout_max_trajectories: 2
