# V5.6-A broad architecture screening (research plan v2.1 §3.3 / 附录 B.3).
# 14 architectures x 1 seed (17), unified Encoder/Heads, Core ~0.1M params,
# 30-40% reaction subset covering all training families.
# NOTE: dataset.kind=synthetic by default (V5.5 real contract pending). Switch to
#       kind: idx_v2 + root: /pes2ts_data/v53mp_50k_data/idx_v2 once the V5.5
#       contract/adapter is frozen; smoke split is then curve-hash based and
#       explicitly NOT the frozen V5.5 ID/OOD protocol.
stage: V56-A
seed: 17
archs: [M01, M02, M03, M04, M05, M06, M07, M08, M09, M10, M11, M12, M13, M14]

dataset:
  kind: synthetic
  path: data/interim/v5_synthetic
  seed: 17
  n_trajectories_per_reaction: 2
  force_rebuild: true
  # 30-40% reaction subset is applied at the batch sampler level; the synthetic
  # fixture itself keeps all splits so valid/id/OOD remain usable.
  subset_fraction: 0.35

model:
  encoder: descriptor
  hidden_dim: 64
  core_hidden_dim: auto
  core_param_budget: 100000
  core_layers: 2
  dropout: 0.0
  process_classes: 3

training:
  batch_size: 8
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum: 1
  max_epochs: 5
  patience: 3
  subset_fraction: 0.35
  history_len: 16
  device: auto
  train_split: train
  val_split: valid

eval:
  cpu_benchmark: true
  cpu_iters: 20
  cpu_warmup: 3
  max_eval_batches: null
  run_rollout: true
  rollout_steps: 8
  rollout_max_trajectories: 4
